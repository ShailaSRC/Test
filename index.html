<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>EDITOR SCRIPT: Permainan Penyuntingan Naskah</title>

    <!-- Polyfill untuk drag-and-drop di layar sentuh -->
    <script src="https://unpkg.com/drag-drop-touch"></script>

    <!-- Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=VT323&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ==================================================
           VARIABEL WARNA RETRO
           ================================================== */

        :root {
            --bg-app: #1e1e1c;
            --bg-panel: #2a2a28;
            --border-dark: #121211;
            --border-light: #4a4a47;

            --text-muted: #88867c;
            --text-normal: #b5b3a6;
            --text-highlight: #e0ddcc;

            --paper-bg: #e6dfc8;
            --paper-border: #b0a688;
            --paper-text: #2a2926;
            --paper-dashed: #b5aa8b;

            --block-bg: #d9d1ba;
            --block-border: #999075;

            --accent-yellow: #d6b054;
            --color-scene: #7fa37f;
            --color-char: #b56c6c;

            --font-ui: 'VT323', monospace;
            --font-script: 'Courier Prime', monospace;
        }


        /* ==================================================
           RESET
           ================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Mencegah munculnya scroll global */
        }


        /* ==================================================
           BODY
           ================================================== */

        body {
            background-color: var(--bg-app);
            color: var(--text-normal);
            font-family: var(--font-ui);

            /* MEMAKSA VIEWPORT: Ini memperbaiki bug terpotong di bagian bawah */
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            display: flex;
            flex-direction: column;

            user-select: none;
            overscroll-behavior: none;
        }


        /* ==================================================
           CRT SCANLINE
           ================================================== */

        body::after {
            content: "";

            display: block;

            position: absolute;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background:
                linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.1) 50%
                );

            background-size: 100% 4px;

            z-index: 100;

            pointer-events: none;

            opacity: 0.3;
        }


        /* ==================================================
           CUSTOM SCROLLBAR
           WINDOWS 95 RETRO DARK
           FIXED + TOUCH STABLE
           ================================================== */

        .retro-scrollbar {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: scroll !important;
            overflow-x: hidden;
            overscroll-behavior: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
            touch-action: pan-y;
        }

        .retro-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }


        /* ==================================================
           AREA PEMBUNGKUS SCROLL
           ================================================== */

        .scroll-container {
            flex: 1;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }


        /* ==================================================
           CUSTOM SCROLLBAR TRACK
           ================================================== */

        .w95-scrollbar {
            position: absolute;
            top: 2px;
            right: 2px;
            bottom: 2px;
            width: 14px;
            background: var(--bg-app);
            z-index: 50;
            box-sizing: border-box;
            border-left: 2px solid var(--border-dark);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            pointer-events: auto;
        }


        /* ==================================================
           TRACK
           ================================================== */

        .w95-scroll-track {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #161514;
            box-sizing: border-box;
            cursor: pointer;
            touch-action: none;
        }


        /* Pola retro pada track */
        .w95-scroll-track::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(
                    45deg,
                    #2a2a28 25%,
                    transparent 25%,
                    transparent 75%,
                    #2a2a28 75%
                ),
                linear-gradient(
                    45deg,
                    #2a2a28 25%,
                    transparent 25%,
                    transparent 75%,
                    #2a2a28 75%
                );
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            opacity: 0.5;
            pointer-events: none;
        }


        /* ==================================================
           THUMB
           ================================================== */

        .w95-scroll-thumb {
            position: absolute;
            left: 1px;
            right: 1px;
            top: 0;
            height: 40px;
            min-height: 40px;
            background: var(--border-light);
            box-sizing: border-box;
            cursor: grab;
            z-index: 2;
            border: 1px solid var(--border-dark);
            border-top: 1px solid #6a6a66;
            border-left: 1px solid #6a6a66;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            will-change: transform;
        }


        .w95-scroll-thumb.dragging {
            cursor: grabbing;
            background: #3b3a36;
            border-top: 1px solid var(--border-dark);
            border-left: 1px solid var(--border-dark);
            border-right: 1px solid #6a6a66;
            border-bottom: 1px solid #6a6a66;
        }


        /* ==================================================
           GRIP THUMB
           ================================================== */

        .w95-scroll-thumb::after {
            content: "";
            position: absolute;
            left: 2px;
            right: 2px;
            top: 50%;
            height: 2px;
            transform: translateY(-50%);
            background: var(--bg-panel);
            box-shadow: 0 -2px 0 var(--border-dark), 0 2px 0 var(--border-dark);
            pointer-events: none;
        }


        /* ==================================================
           SCROLLBAR DISABLED
           ================================================== */

        .w95-scrollbar.disabled {
            opacity: 0.3;
        }
        .w95-scrollbar.disabled .w95-scroll-thumb {
            cursor: default;
        }


        /* ==================================================
           PADDING CONTENT
           ================================================== */

        #block-container {
            padding: 18px;
            padding-right: 38px;
        }


        /* ==================================================
           TOUCH DEVICE
           ================================================== */

        @media (pointer: coarse) {
            .w95-scrollbar {
                width: 18px;
            }
            .w95-scroll-thumb {
                min-height: 50px;
            }
            #block-container {
                padding: 18px;
                padding-right: 42px;
            }
        }


        /* =========================================================
           GAME LAYOUT (Default / Landscape)
        ========================================================= */
        #game-layout {
            width: 100%;
            height: 100dvh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            position: relative;
            z-index: 10;
        }

        #game-header {
            flex: 0 0 auto;
            min-height: 60px; /* Diperkecil agar lebih padat */
            display: grid;
            grid-template-columns: 210px minmax(0, 1fr) 210px;
            gap: 10px;
            align-items: center;
            background: var(--bg-panel);
            border: 2px solid var(--border-dark);
            padding: 8px 15px; /* Padding dikurangi */
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }


        /* ==================================================
           HEADER KIRI
           ================================================== */

        .header-left {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
        }

        .settings-btn {
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            color: var(--text-highlight);
        }

        .title-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-left h1 {
            margin: 0;
            font-size: 1.6rem; /* Font diperkecil sedikit */
            color: var(--text-highlight);
            letter-spacing: 2px;
            font-weight: normal;
            line-height: 1.1;
        }

        .header-left .day-text {
            font-size: 0.95rem; /* Font diperkecil sedikit */
            color: var(--text-muted);
        }


        /* ==================================================
           HEADER TENGAH
           ================================================== */

        .header-center {
            display: flex;
            gap: 10px;
            align-items: stretch;
            justify-content: center;
        }

        .client-avatar {
            width: 55px; /* Diperkecil */
            flex-shrink: 0;
            background: #3b3a36;
            border: 2px solid var(--border-dark);
            border-radius: 4px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .client-avatar svg {
            width: 85%;
            height: auto;
            margin-bottom: -5px;
            fill: #1c1c1a;
        }

        .client-brief-box {
            flex: 1;
            max-width: 500px;
            border: 2px solid var(--border-dark);
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
        }

        .client-brief-box .brief-title {
            background: rgba(255,255,255,0.03);
            border-bottom: 2px solid var(--border-dark);
            padding: 2px 8px; /* Padding dikurangi */
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .client-brief-box .brief-content {
            padding: 4px 8px; /* Padding dikurangi */
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem; /* Font dikurangi sedikit */
            font-family: var(--font-ui);
            text-transform: uppercase;
            color: var(--text-normal);
        }

        .brief-line {
            display: flex;
            align-items: flex-start;
            line-height: 1.3;
        }

        .brief-line .label {
            color: var(--text-muted);
            margin-right: 8px;
            font-weight: bold;
            min-width: 80px;
        }

        .brief-line .value {
            color: var(--text-highlight);
            flex: 1;
            word-wrap: break-word;
            white-space: normal;
        }


        /* ==================================================
           HEADER KANAN
           ================================================== */

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .retro-btn {
            background: var(--bg-panel);
            border: 2px solid var(--border-dark);
            color: var(--text-highlight);
            font-family: var(--font-ui);
            font-size: 0.95rem; /* Font diperkecil sedikit */
            padding: 4px 12px; /* Padding diperkecil */
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .retro-btn:active {
            transform: translate(2px,2px);
            box-shadow: none;
        }

        .retro-btn.primary {
            background: #b56c6c;
            color: #fff;
            border-color: #5c2f2f;
        }


        /* ==================================================
           MAIN AREA
           ================================================== */

        #main-area {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: 290px minmax(0, 1fr) 240px;
            gap: 10px;
            overflow: hidden;
        }

        .panel {
            background: var(--bg-panel);
            border: 2px solid var(--border-dark);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }


        /* ==================================================
           PANEL KIRI
           ================================================== */

        #left-panel {
            position: relative;
        }

        .panel-header {
            padding: 15px;
            border-bottom: 2px solid var(--border-dark);
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 1.4rem;
            color: var(--text-highlight);
            letter-spacing: 1px;
            margin: 0;
        }

        .panel-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }


        /* ==================================================
           SCRIPT BLOCK
           ================================================== */

        .script-block {
            background: var(--block-bg);
            border: 2px solid var(--block-border);
            color: var(--paper-text);
            font-family: var(--font-script);
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            cursor: grab;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s;
            width: 100%;
            position: relative;
            z-index: 1;
            padding: 10px 12px;
            box-sizing: border-box;
        }

        .script-block:active {
            cursor: grabbing;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }

        .block-type-label {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 1px;
            opacity: 0.8;
            font-weight: bold;
            color: var(--paper-text);
        }

        .block-text {
            line-height: 1.3;
            text-align: left;
        }


        /* ==================================================
           PANEL TENGAH
           ================================================== */

        #center-panel {
            flex: 1;
            background: #1c1c1b;
            border: 2px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .paper-sheet {
            background: var(--paper-bg);
            width: 100%;
            max-width: 750px;
            height: max-content; /* FIXED: agar tidak terpotong */
            flex: 1 0 auto;      /* FIXED: mengisi area kosong & expand */
            border: 1px solid var(--paper-border);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            color: var(--paper-text);
            padding: 25px 35px;
            position: relative;
        }

        .paper-header {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-ui);
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 6px;
            flex-shrink: 0;
        }

        .paper-header .title {
            flex: 1;
            text-align: center;
            font-weight: bold;
        }

        .paper-header .page-num {
            width: 60px;
            text-align: right;
        }


        /* ==================================================
           SLOT
           ================================================== */

        .slot-row {
            display: flex;
            align-items: stretch;
            margin-bottom: 8px;
            min-height: 50px;
            width: 100%;
        }

        .slot-number {
            width: 30px;
            font-family: var(--font-script);
            color: #777;
            font-size: 1rem;
            padding-top: 10px;
            text-align: left;
            flex-shrink: 0;
        }

        .drop-slot {
            flex: 1;
            border: 2px dashed var(--paper-dashed);
            display: flex;
            align-items: stretch;
            transition: background 0.2s, border-color 0.2s;
            min-height: 50px;
            background: rgba(0,0,0,0.02);
            width: 100%;
        }

        .drop-slot.drag-over {
            background: rgba(0,0,0,0.08);
            border-color: #555;
        }

        .drop-slot > .script-block {
            margin-bottom: 0;
            width: 100%;
            box-shadow: none;
            background: transparent;
            border: 1px solid var(--paper-dashed);
            padding: 8px 10px;
        }

        .drop-slot > .script-block .block-text {
            text-align: justify;
        }
